apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone-control
  namespace: uav-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drone-control
  template:
    metadata:
      labels:
        app: drone-control
    spec:
      containers:
        - name: control
          image: uav-control:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: ROUTER_ADDR
              value: "http:sim-router:9000"
            - name: CONTROL_RANGE
              value: "35"
            - name: DRONE_RANGE
              value: "25"

---
apiVersion: v1
kind: Service
metadata:
  name: drone-control
  namespace: uav-sim
spec:
  selector:
    app: drone-control
  ports:
    - port: 8081
      targetPort: 8081
